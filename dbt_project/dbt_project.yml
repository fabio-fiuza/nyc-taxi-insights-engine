name: 'nyc_taxi_insights_engine'
version: '1.0.0'
config-version: 2

profile: nyc_taxi_insights_engine

seed-paths: ["seeds"]
model-paths: ["models"]
macro-paths: ["macros"]
clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  nyc_taxi_insights_engine:
    +schema: raw
    taxi_zone_lookup:
      +file_format: csv
    payment_methods_lookup:
      +file_format: csv
    ratecode_lookup:
      +file_format: csv
    vendors_lookup:
      +file_format: csv

models:
  nyc_taxi_insights_engine:
    +static_analysis: strict
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts