# yaml-language-server: $schema=https://www.getdbt.com/dbt-schema.json
version: 2

models:
  - name: stg_nyc_taxi__yellow_trips
    description: "Staging model cleaning, casting, and standardizing raw NYC Yellow Taxi trip records."
    columns:
      - name: trip_key
        description: "Surrogate key uniquely identifying each trip record generated from composite trip attributes."
        tests:
          - not_null
          - unique:
              config:
                severity: warn

      - name: vendor_id
        description: "A code indicating the TPEP provider that provided the record (1 = Creative Mobile Technologies, LLC, 2 = Curb Mobility, LLC, 6 = Myle Technologies Inc, 7 = Helix, 99 = Null/unknown)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['1', '2', '6', '7', '99']

      - name: pickup_location_id
        description: "TLC Taxi Zone in which the taximeter was engaged."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_nyc_taxi__zones')
                field: location_id

      - name: dropoff_location_id
        description: "TLC Taxi Zone in which the taximeter was disengaged."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_nyc_taxi__zones')
                field: location_id

      - name: ratecode_id
        description: "The final rate code in effect at the end of the trip (1 = Standard rate, 2 = JFK, 3 = Newark, 4 = Nassau/Westchester, 5 = Negotiated fare, 6 = Group ride, 99 = Null/unknown)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['1', '2', '3', '4', '5', '6', '99']
              config:
                severity: warn

      - name: payment_type
        description: "A numeric code signifying how the passenger paid for the trip (0 = Flex Fare trip, 1 = Credit card, 2 = Cash, 3 = No charge, 4 = Dispute, 5 = Unknown, 6 = Voided trip)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['0', '1', '2', '3', '4', '5', '6']
              config:
                severity: warn

      - name: pickup_datetime
        description: "The date and time when the meter was engaged."
        tests:
          - not_null

      - name: dropoff_datetime
        description: "The date and time when the meter was disengaged."
        tests:
          - not_null

      - name: passenger_count
        description: "The number of passengers in the vehicle (driver-entered value)."

      - name: trip_distance
        description: "The elapsed trip distance in miles reported by the taximeter."

      - name: store_and_fwd_flag
        description: "Flag indicating whether the trip record was held in vehicle memory before sending to the vendor due to connection loss (Y = store and forward trip, N = not a store and forward trip, U = unknown)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Y', 'N', 'U']

      - name: fare_amount
        description: "The time-and-distance fare calculated by the taximeter in USD."

      - name: extra
        description: "Miscellaneous extras and surcharges (e.g., rush hour and overnight charges)."

      - name: mta_tax
        description: "Tax of $0.50 automatically triggered based on the metered rate in use."

      - name: tip_amount
        description: "Tip amount automatically populated for credit card tips. Cash tips are not included."

      - name: tolls_amount
        description: "Total amount of all tolls paid during the trip."

      - name: improvement_surcharge
        description: "Improvement surcharge assessed on trips at the flag drop."

      - name: congestion_surcharge
        description: "Total amount collected in trip for NYS congestion surcharge."

      - name: airport_fee
        description: "Airport fee for pick up only at LaGuardia and John F. Kennedy Airports."

      - name: cbd_congestion_fee
        description: "Per-trip charge for MTA's Congestion Relief Zone starting Jan. 5, 2025."

      - name: total_amount
        description: "The total amount charged to passengers. Does not include cash tips."

  - name: stg_nyc_taxi__zones
    description: "Staging model for NYC TLC taxi zones and regulatory geographic divisions."
    columns:
      - name: location_id
        description: "TLC Taxi Zone numeric identifier (natural primary key)."
        tests:
          - not_null
          - unique

      - name: borough
        description: "New York City borough containing the taxi zone."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['EWR', 'Queens', 'Bronx', 'Manhattan', 'Brooklyn', 'Unknown', 'Outside of NYC', 'Staten Island']

      - name: zone_name
        description: "Official TLC geographic zone name (e.g., Central Park, JFK Airport)."
        tests:
          - not_null

      - name: service_zone
        description: "TLC regulatory service zone category (e.g., Yellow Zone, Boro Zone, Airports, EWR, N/A)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Boro Zone', 'Yellow Zone', 'EWR', 'Airports', 'N/A']
